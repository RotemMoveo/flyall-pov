    p: ['משתמשים בכרטיס אשראי FlyAll וצוברים',
        'נקודות עד המועד שנקבע'],
    note: ['1 נקודה = 1₪', 'ככל שתצברו יותר נקודות ככה תשלמו פחות בסוף'] },
  { art: ART_FLY,  tone: 'magenta', h: 'משלימים את היתרה ומגשימים',
    p: ['משלימים את היתרה בנקודות, בכסף או גם וגם,',
        'ויוצאים להגשים את החלום'],
    note: ['עד חודשיים לפני המועד', 'מסיימים את התשלום ויוצאים לדרך'],
    cta: 'לרכישה' },
];

/* the little two-note approval, synthesised — no asset to ship or preload */
let actx = null;
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
}
function chime(){
  if (!actx) return;
  try{
    const t0 = actx.currentTime;
    [[880, 0], [1318.5, .085]].forEach(([f, at]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(.07, t0 + at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + .17);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + at); o.stop(t0 + at + .22);
    });
  }catch(e){}
}

function buildHow(){
  const how = el('div','how');
  how.appendChild(el('div','how__veil'));

  const track = el('div','how__track');
  const steps = HOW.map(d => {
    const st = el('section','how__step tone-' + d.tone,
      '<div class="how__art">' + d.art + '</div>' +
      '<div class="how__copy">' +
        '<h3>' + d.h + '</h3>' +
        d.p.map(t => '<p>' + t + '</p>').join('') +
        '<div class="how__note"><b>' + d.note[0] + '</b>' +
          '<span>' + d.note[1] + '</span></div>' +
        (d.cta ? '<button class="how__cta ds-btn ds-btn--primary ds-btn--block">' + d.cta + '</button>' : '') +
      '</div>');
    track.appendChild(st);
    return st;
  });
  how.appendChild(track);

  const dots = el('div','how__dots');
  HOW.forEach(() => dots.appendChild(el('i')));
  how.appendChild(dots);

  const close = el('button','how__close', X);
  close.setAttribute('aria-label','סגירה');
  how.appendChild(close);

  let at = -1, chimeAt = null;
  /* the tick starts at 1.15s and runs .42s — the sound lands as it completes */
  const TICK_DONE = 1570;
  function show(i){
    if (i === at) return;
    at = i;
    clearTimeout(chimeAt);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i));
    /* the card redraws itself every time you come back to it, sound and all */
    steps.forEach((st, j) => st.classList.toggle('play', j === i));
    if (i === 1) chimeAt = setTimeout(chime, TICK_DONE);
  }
  track.addEventListener('scroll', () => requestAnimationFrame(() => {
    const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
    let best = 0, dist = Infinity;
    steps.forEach((st, j) => {
      const r = st.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - mid);
      if (d < dist) { dist = d; best = j; }
    });
    show(best);
  }), { passive:true });

  how._open  = () => { track.scrollLeft = 0; at = -1; show(0); };
  how._quiet = () => { clearTimeout(chimeAt); };
  how._close = close;
  return how;
}

const reel = el('div','reel');
const bars = el('div','reel__bars');
ARC.forEach(() => bars.appendChild(el('i')));
reel.appendChild(bars);

const reelTrack = el('div','reel__track');
const slides = ARC.map(d => {
  const sl = el('section','reel__slide');
  const v = document.createElement('video');
  v.className = 'reel__v';
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('muted','');
  v.preload = 'none'; v.dataset.src = d.src;
  const stage_ = el('div','reel__stage');
  stage_.appendChild(v);
  stage_.appendChild(el('div','reel__foot'));
  const logos = d.logos.map(f => '<img src="assets/logos/' + f + '" alt="">')
                       .join(d.logos.length > 1 ? '<em>&amp;</em>' : '');
  const [title, place] = d.event.split(' · ');
  if (d.logos.length) stage_.appendChild(el('div','reel__crest' + (d.logos.length > 1 ? ' duo' : ''), logos));
  stage_.appendChild(el('div','reel__copy',
    '<div class="event">' + title + '</div>' +
    '<div class="meta">' + [place, d.date].map(t => '<span>' + t + '</span>').join('<i></i>') + '</div>'));
  const veil = el('div','reel__veil');
  stage_.appendChild(veil);
  sl.appendChild(stage_);

  const i = ARC.indexOf(d);
  sl.appendChild(el('div','reel__detail',
      '<h3 class="rd__title">' + d.event.split(' · ')[0] + '</h3>'
    + '<p class="rd__about">' + ABOUT[i] + '</p>'
    + '<div class="rd__glass">'
    +   '<p class="rd__lbl">' + ((d.dates || DATES).length > 1 ? (d.dates || DATES).length + ' מועדים' : 'מועד אחד') + '</p>'
    +   '<p class="rd__dates">' + (d.dates || DATES).map(x => '<span>' + x + '</span>').join('<i></i>') + '</p>'
    +   '<div class="rd__rule"></div>'
    +   '<p class="rd__lbl">' + PACKS.length + ' חבילות</p>'
    +   '<div class="rd__tiers">' + PACKS.map(([n]) => '<span>' + n + '</span>').join('') + '</div>'
    +   '<p class="rd__price"><span class="m-price"><b><small class="rd__from">החל מ־</small>₪' + (d.pts || PACKS[0][1].replace(' נק׳', '')) + ' או ' + (d.pts || PACKS[0][1].replace(' נק׳', '')) + ' נקודות <span class="spark" aria-hidden="true"></span></b>'
    +     '<span>בחבילת בסיס · או 20% מקדמה עכשיו, והיתרה עד למועד</span></span>'
    +     '<span class="g-price"><b><small class="rd__from">החל מ־</small>₪' + (d.pts || PACKS[0][1].replace(' נק׳', '')) + '</b><span>בחבילת בסיס</span>'
    +     '<span class="rd__deal"><span class="spark" aria-hidden="true"></span><span>עם כרטיס FlyAll אפשר לשריין עכשיו ב־<strong>20%</strong> ולהשלים את היתרה בהמשך</span></span></span></p>'
    + '</div>'));

  const act = el('div','reel__act','<button class="rd__cta ds-btn ds-btn--primary ds-btn--block">איך מגשימים את החלום?</button>'
    + '<button class="rd__buy ds-btn ds-btn--block" type="button"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.2 1 3 9.1h4.3L6.6 15 13 6.8H8.6z"/></svg>לרכישה מיידית</button>');
  if (HAVE) act.insertBefore(el('div','rd__have', HAVE), act.firstChild);   /* shown by the points switch */
  const hint = el('div','reel__hint', '<i></i><span>גללו לגלות עוד</span>');
  sl.querySelector('.reel__copy').prepend(hint);   /* sits over the title, rides its entrance */
  sl.appendChild(act);

  /* the black rises with the scroll; the nudge bows out once it starts */
  sl.addEventListener('scroll', () => {
    const p = Math.min(1, sl.scrollTop / (sl.clientHeight * 0.45));   /* fully black well before the sheet ends */
    veil.style.backgroundPosition = '0 ' + (p * 100).toFixed(1) + '%';
    /* the sheet no longer blacks the frame out, so the card's copy bows out itself */
    const cp = sl.querySelector('.reel__copy'), cr = sl.querySelector('.reel__crest');
    if (cp) cp.style.opacity = sl.scrollTop > 0 ? String(Math.max(0, 1 - p * 2.2)) : '';
    if (cr) cr.style.opacity = sl.scrollTop > 0 ? String(Math.max(0, 1 - p * 1.4)) : '';
    hint.style.opacity = sl.scrollTop > 24 ? '0' : '';
    act.classList.toggle('show', sl.scrollTop > 40);
  }, { passive:true });

  reelTrack.appendChild(sl);
  return sl;
});
reel.appendChild(reelTrack);

const how = buildHow();
reel.appendChild(how);
function openHow(){
  unlockAudio();                       /* we are inside the tap, so this is allowed */
  slides.forEach(sl => { sl.scrollTop = 0; });
  reel.classList.add('how-open');
  how._open();
}
function closeHow(){ reel.classList.remove('how-open'); how._quiet(); }
how._close.onclick = closeHow;
reel.addEventListener('click', e => {
  if (e.target.closest('.rd__cta')) openHow();
});

const reelClose = el('button','reel__close', X);
reelClose.setAttribute('aria-label','סגירה');
reel.appendChild(reelClose);
/* desktop has no swipe: two round arrows beside the story column (hidden below 1024px) */
const reelPrev = el('button','reel__nav reel__nav--prev', CHV_R);
const reelNext = el('button','reel__nav reel__nav--next', CHV_L);
reelPrev.setAttribute('aria-label','החוויה הקודמת');
reelNext.setAttribute('aria-label','החוויה הבאה');
reel.append(reelPrev, reelNext);
function toSlide(i){
  if (i < 0 || i >= slides.length) return;
  const r = slides[i].getBoundingClientRect(), t = reelTrack.getBoundingClientRect();
  reelTrack.scrollBy({ left: (r.left + r.width/2) - (t.left + t.width/2), behavior: 'smooth' });
}
reelPrev.onclick = () => toSlide(reelIndex - 1);
reelNext.onclick = () => toSlide(reelIndex + 1);
document.body.appendChild(reel);

let reelIndex = -1;
function setSlide(i){
  if (i === reelIndex) return;
  reelIndex = i;
  slides.forEach((sl, j) => {
    const v = sl.querySelector('video');
    if (Math.abs(j - i) <= 1 && !v.src) v.src = v.dataset.src;   /* only the neighbours load */
    if (j === i) { v.currentTime = 0; play(v); } else v.pause();
    sl.classList.remove('live');
  });
  slides.forEach(sl => {
    sl.scrollTop = 0;
    const a = sl.querySelector('.reel__act'); if (a) a.classList.remove('show');
    const vl = sl.querySelector('.reel__veil'); if (vl) vl.style.backgroundPosition = '0 0';
  });
  requestAnimationFrame(() => slides[i] && slides[i].classList.add('live'));
  [...bars.children].forEach((b, j) => b.classList.toggle('on', j === i));
  reelPrev.disabled = i <= 0;
  reelNext.disabled = i >= slides.length - 1;
}
reelTrack.addEventListener('scroll', () => requestAnimationFrame(() => {
  const mid = reelTrack.getBoundingClientRect().left + reelTrack.clientWidth / 2;
  let best = 0, dist = Infinity;
  slides.forEach((sl, j) => {
    const r = sl.getBoundingClientRect();
    const d = Math.abs((r.left + r.width / 2) - mid);
    if (d < dist) { dist = d; best = j; }
  });
  setSlide(best);
}), { passive:true });

function openReel(i){
  reel.classList.add('open');
  document.body.classList.add('reel-open');
  stopAll();                       /* nothing plays behind the full frame */
  requestAnimationFrame(() => {
    const sl = slides[i];
    const r = sl.getBoundingClientRect(), t = reelTrack.getBoundingClientRect();
    reelTrack.scrollLeft += (r.left + r.width/2) - (t.left + t.width/2);
    reelIndex = -1;
    setSlide(i);
  });
}
function closeReel(){
  reel.classList.remove('how-open');
  how._quiet();
  reel.classList.remove('open');
  document.body.classList.remove('reel-open');
  slides.forEach(sl => sl.querySelector('video').pause());
  reelIndex = -1;
  arc._shape && arc._shape();      /* hand playback back to the carousel */
}
reelClose.onclick = closeReel;
addEventListener('keydown', e => {
  if (!reel.classList.contains('open')) return;
  if (e.key === 'Escape') { if (reel.classList.contains('how-open')) closeHow(); else closeReel(); return; }
  if (!DESK.matches || reel.classList.contains('how-open')) return;
  if (e.key === 'ArrowLeft')  toSlide(reelIndex + 1);   /* RTL: the next one sits on the left */
  if (e.key === 'ArrowRight') toSlide(reelIndex - 1);
});

/* ================= SECTION 5 · footer ================= */
const FOOT_GROUPS = [
  ['המוצרים שלנו', ['מלונות בחו״ל', 'טיסות לחו״ל', 'חבילות חו״ל*'],
   '*מחירי החבילות המוצגות באתר הינן לאדם בהרכב של זוג בחדר'],
  ['שירות ומידע',  ['שירות לקוחות', 'פניית שירות', 'תנאי שימוש וביטול', 'נגישות', 'אזהרות מסע']],
];
/* right to left, as in the design: Instagram sits nearest the edge */
const SOCIAL = [['Instagram','instagram'], ['Facebook','facebook'], ['WhatsApp','whatsapp']];
const FOOT_LEGAL = 'שימו לב, התוכן ו/או המידע בעמוד זה הינו דינאמי ומשתנה מעת לעת, כך שייתכן שהמידע ' +
  'כבר אינו רלוונטי נכון לרגעים אלו. יש לציין כי המידע המצוי בטקסטים אינו בגדר ייעוץ מקצועי ו/או ' +
  'עובדתי, אלא מבוסס על הידע המצוי בידי חברת FlyAll בעת כתיבתו. אין להתייחס למידע כמוחלט ו/או ' +
  'מחייב. המידע המדויק והעדכני ביותר לגבי הזמנתכם יופיע בעמוד הזמנת המוצר בלבד.';

function buildFoot(){
  const box = el('footer','foot');
  const groups = el('div','foot__groups');
  const groupEls = FOOT_GROUPS.map(([title, links, note]) => {
    const g = el('nav','foot__group', '<h4>'+title+'</h4>' +
      links.map(l => '<a href="#">'+l+'</a>').join('') +
      (note ? '<p class="foot__note"><span>'+note+'</span></p>' : ''));
    groups.appendChild(g);
    return g;
  });
  const follow = el('div','foot__group', '<h4>עקבו אחרינו</h4>' +
    '<div class="foot__social">' + SOCIAL.map(([name, f]) =>
      '<a href="#" aria-label="'+name+'"><img src="assets/social/'+f+'.svg" width="40" height="40" alt=""></a>'
    ).join('') + '</div>');
  groups.appendChild(follow);
  box.appendChild(groups);

  const rule = el('img','foot__rule');
  rule.src = 'assets/social/line.svg'; rule.alt = '';
  box.appendChild(rule);
  const legal = el('p','foot__legal', FOOT_LEGAL);
  box.appendChild(legal);

  enter(box, [...groupEls, follow, legal], 130);
  return box;
}

/* ---------------- mount ---------------- */
const stage = document.getElementById('stage');
const arc = buildArc(), ask = buildAsk(), perks = buildPerks(), foot = buildFoot();
stage.appendChild(arc);
stage.appendChild(ask);
stage.appendChild(perks);
stage.appendChild(foot);
requestAnimationFrame(() => { arc._shape && arc._shape(); ask._tick(); });
/* coming back from a category page lands on the four windows, not the top */
if (location.hash === '#cats') requestAnimationFrame(() => ask.scrollIntoView({ block:'start' }));

/* The page opens straight into the lobby — there is no intro. The bar still
   floats in, and everything below it is released to its own on-arrival animation. */
const header = document.querySelector('.fa-header');
if (header) header.classList.add('rv');
let started = false;
function start(){
  if (started) return;
  started = true;
  if (header) header.classList.add('in');
  armEntries();                     /* sections start watching from here */
  arc._arm();                       /* and the rail's videos start playing */
}
/* a frame first, so the bar has an opacity to travel from — but never only a
   frame: a throttled rAF would leave the whole page invisible and inert */
requestAnimationFrame(start);
setTimeout(start, 120);

/* ================= demo · guest / signed-in switch ================= */
(function(){
  const KEY = 'flyall-who';
  const PKEY = 'flyall-points';
  let mode = 'user', pm = 'earn';
  try { mode = localStorage.getItem(KEY) || 'user'; pm = localStorage.getItem(PKEY) || 'earn'; } catch(e){}
  const bar = el('div','who',
    '<button type="button" data-m="guest">אורח</button>' +
    '<button type="button" data-m="user">משתמש מזוהה</button>');
  bar.setAttribute('role','group');
  bar.setAttribute('aria-label','מצב תצוגה');
  function set(m){
    mode = m;
    document.body.classList.toggle('is-guest', m === 'guest');
    applyPts();
    bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
    try { localStorage.setItem(KEY, m); } catch(e){}
  }
  bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(b.dataset.m); });
  document.body.appendChild(bar);
  set(mode);
  /* enough points to buy / still earning: moves the balance and shows the "you have enough" banner */
  const pbar = el('div','who who--pts',
    '<button type="button" data-p="earn">צבירת נקודות</button>' +
    '<button type="button" data-p="enough">מספיק נקודות</button>');
  pbar.setAttribute('role','group');
  pbar.setAttribute('aria-label','מצב נקודות');
  /* a guest has no points, so the "enough" banner and its room only apply when signed in */
  function applyPts(){
    if (pm === 'enough' && mode === 'user') document.documentElement.dataset.points = 'enough';
    else delete document.documentElement.dataset.points;
  }
  function setPts(m){
    pm = m;
    applyPts();
    document.querySelectorAll('.lead__me').forEach(n => n._paint && n._paint());
    pbar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === m));
    try { localStorage.setItem(PKEY, m); } catch(e){}
  }
  pbar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPts(b.dataset.p); });
  document.body.appendChild(pbar);
  setPts(pm);
})();
